name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A CSP do MV3 (script-src 'self') bloqueia geração dinâmica de código.
      # Uma dependência que use eval só quebraria em runtime, na máquina do
      # usuário — então a barreira fica aqui (CLAUDE.md, critério 6).
      - name: Verificar CSP e ausência de CDN
        run: |
          if grep -rEl "googleapis|gstatic|unpkg|jsdelivr" dist-ext; then
            echo "::error::Referência a CDN encontrada no build."
            exit 1
          fi
          if grep -rE "new Function\(|[^.[:alnum:]_]eval[[:space:]]*\(" dist-ext --include="*.js" -l; then
            echo "::error::eval/new Function no bundle da extensão — a CSP do MV3 bloqueia."
            exit 1
          fi

      - name: Compute version and zip
        id: pack
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          ARTIFACT="PlanejoEproc-${VERSION}.zip"
          # O manifest.json precisa ficar na RAIZ do zip, senão "Carregar sem
          # compactação" não reconhece a pasta extraída como extensão.
          (cd dist-ext && zip -r "../${ARTIFACT}" .)
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PlanejoEproc-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.artifact }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.pack.outputs.version }}
          files: ${{ steps.pack.outputs.artifact }}
          generate_release_notes: true
