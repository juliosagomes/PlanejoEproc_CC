<!--
  Elementos de identificação da sessão, presentes em qualquer tela autenticada.
  Anonimizados: login real → x0000000, nome real → FULANO DE TAL.

  Formato observado:
    - option.value  → 32 caracteres, NÃO numérico (é o par unidade+perfil)
    - option.text   → "SIGLA/PAPEL"
    - option.title  → "Nome por extenso da unidade - SIGLA/PAPEL"
    - #nav-profile  → "NOME DO USUÁRIO (login)" seguido da lista de perfis

  Por que a chave de cache é host::login::sigla e não só host: um host serve
  TODAS as unidades do tribunal, e o mesmo usuário aqui tem 9 perfis. Chavear só
  por host faria a última coleta sobrescrever a anterior sem nada denunciar a
  troca.

  Cuidado: option.value identifica o par unidade+perfil, não a unidade. O mesmo
  usuário aparece na mesma vara com papéis diferentes ("USUÁRIO AUTOMATIZADOR" e
  "GERENTE DE SECRETARIA"), com values distintos. Chavear pelo value criaria um
  catálogo por papel. A sigla (antes da "/") é o recorte certo.
-->
